name: Update Arsenal + Fantasy Hub

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install E1002 render dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install --upgrade pip
          pip install pillow

      - name: Update Arsenal football data
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/update-football.mjs

      - name: Update Arsenal Squad Watch
        run: node scripts/update-squad-watch.mjs

      - name: Update Fantasy teams
        run: node scripts/update-fantasy.mjs

      - name: Generate static E1002 HTML source
        run: node scripts/render-static-dashboard.mjs

      - name: Generate Home Assistant dashboard
        run: node scripts/render-home-assistant.mjs

      - name: Render direct E1002 BMP
        run: node scripts/render-e1002-bmp.mjs

      - name: Commit updated dashboards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/football.json \
            data/fantasy.json \
            index.html \
            ha.html \
            arsenal.bmp

          if git diff --cached --quiet
          then
            echo "No dashboard changes to commit."
          else
            git commit -m "Update Arsenal and Fantasy dashboards"
            git push
          fi
