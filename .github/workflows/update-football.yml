name: Update Arsenal + Fantasy Hub

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python image renderer
        run: python -m pip install --quiet pillow

      - name: Update Arsenal football data
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/update-football.mjs

      - name: Update Arsenal Squad Watch
        run: node scripts/update-squad-watch.mjs

      - name: Update Fantasy teams
        run: node scripts/update-fantasy.mjs

      - name: Generate E1002 static image
        run: python scripts/render-e1002-image.py

      - name: Generate Home Assistant dashboard
        run: node scripts/render-home-assistant.mjs

      - name: Commit updated dashboards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/football.json data/fantasy.json e1002.png index.html ha.html

          if git diff --cached --quiet
          then
            echo "No dashboard changes to commit."
          else
            git commit -m "Update Arsenal and Fantasy dashboards"
            git push
          fi
