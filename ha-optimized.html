<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arsenal + Fantasy Hub - Compact</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3f4f6;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #hub {
      position: absolute;
      top: 0;
      left: 0;
      border: 0;
      transform-origin: top left;
      background: #f3f4f6;
    }
  </style>
</head>
<body>
  <div id="stage">
    <iframe id="hub" src="./ha.html" title="Arsenal + Fantasy Hub"></iframe>
  </div>

  <script>
    const hub = document.getElementById("hub");
    const stage = document.getElementById("stage");

    function fitHub() {
      try {
        const doc = hub.contentDocument;
        if (!doc) return;

        const body = doc.body;
        const html = doc.documentElement;

        const naturalWidth = Math.max(
          body.scrollWidth,
          html.scrollWidth,
          1500
        );

        const naturalHeight = Math.max(
          body.scrollHeight,
          html.scrollHeight
        );

        const availableWidth = stage.clientWidth;
        const availableHeight = stage.clientHeight;

        const scale = Math.min(
          availableWidth / naturalWidth,
          availableHeight / naturalHeight,
          1
        );

        hub.style.width = naturalWidth + "px";
        hub.style.height = naturalHeight + "px";
        hub.style.transform = `scale(${scale})`;
      } catch (err) {
        console.error("Unable to fit Arsenal dashboard:", err);
      }
    }

    hub.addEventListener("load", () => {
      fitHub();
      setTimeout(fitHub, 300);
      setTimeout(fitHub, 1000);
    });

    window.addEventListener("resize", fitHub);
  </script>
</body>
</html>
