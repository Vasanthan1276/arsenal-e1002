<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arsenal + Fantasy Hub - Home Assistant</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3f4f6;
    }

    #stage {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #hub {
      border: 0;
      display: block;

      /*
       * 72% visual scale.
       * Width is increased so that after scaling
       * the dashboard still fills the HA panel.
       */
      width: 138.89%;
      height: 138.89%;

      transform: scale(0.72);
      transform-origin: top left;

      background: #f3f4f6;
    }
  </style>
</head>

<body>

  <div id="stage">

    <iframe
      id="hub"
      src="./ha.html"
      title="Arsenal + Fantasy Hub">
    </iframe>

  </div>

  <script>

    const hub = document.getElementById("hub");

    hub.addEventListener("load", () => {

      try {

        const doc = hub.contentDocument;

        if (!doc) return;


        /*
         * Compact the original dashboard slightly.
         * We reduce wasted vertical space rather than
         * shrinking everything aggressively.
         */

        const style = doc.createElement("style");

        style.textContent = `

          body {
            font-size: 13px !important;
          }

          .shell {
            max-width: none !important;
            padding: 10px !important;
          }


          /* HEADER */

          .hero {
            padding: 10px 15px !important;
            border-radius: 12px !important;
          }

          .hero h1 {
            font-size: 24px !important;
          }

          .hero p {
            margin-top: 2px !important;
            font-size: 11px !important;
          }

          .hero .next b {
            font-size: 17px !important;
          }

          .hero .next small,
          .hero .next span {
            font-size: 10px !important;
          }


          /* TAB BUTTONS */

          .tabs {
            padding: 6px 0 !important;
            gap: 6px !important;
          }

          .tab-btn {
            padding: 6px 11px !important;
            font-size: 11px !important;
          }


          /* OVERVIEW GRID */

          .overview-grid {
            gap: 9px !important;
          }

          .card,
          .team-card {
            padding: 10px !important;
            border-radius: 11px !important;
          }


          /* HEADINGS */

          .card h2 {
            font-size: 18px !important;
            margin-bottom: 7px !important;
          }

          .team-card h3 {
            font-size: 15px !important;
            margin: 2px 0 7px !important;
          }


          /* ARSENAL SUMMARY */

          .arsenal-big {
            margin-top: 9px !important;
            gap: 6px !important;
          }

          .arsenal-big div,
          .metrics div,
          .detail-metrics div {
            padding: 6px !important;
          }

          .arsenal-big b {
            font-size: 22px !important;
          }

          .arsenal-big span,
          .metrics span,
          .detail-metrics span {
            font-size: 9px !important;
          }

          .form {
            width: 22px !important;
            height: 22px !important;
            font-size: 12px !important;
          }


          /* FIXTURES / INJURIES */

          .fixture,
          .watch,
          .pl-row,
          .player-row,
          .player-head,
          .mini-table > div {
            min-height: 27px !important;
          }

          .fixture {
            font-size: 11px !important;
          }

          .watch b,
          .watch > span:last-child {
            font-size: 9px !important;
          }


          /* FPL CARDS */

          .fantasy-grid {
            gap: 9px !important;
          }

          .metrics {
            gap: 5px !important;
          }

          .metrics b {
            font-size: 18px !important;
          }

          .team-highlight {
            margin-top: 5px !important;
            padding: 5px 7px !important;
          }

          .team-highlight span {
            font-size: 8px !important;
          }

          .team-highlight b {
            font-size: 9px !important;
          }

          .team-card p {
            margin-top: 4px !important;
            font-size: 8px !important;
          }


          /* PREMIER LEAGUE TABLE */

          .pl-head {
            padding: 4px 0 !important;
          }

          .pl-row {
            font-size: 10px !important;
          }


          /* SNAPSHOT */

          .snapshot-grid {
            gap: 6px !important;
          }

          .snapshot-grid > div {
            padding: 6px !important;
          }

          .snapshot-grid b {
            font-size: 18px !important;
          }

          .snapshot-insights {
            gap: 6px !important;
            margin-top: 6px !important;
          }

          .snapshot-insights > div {
            min-height: 55px !important;
            padding: 6px !important;
          }

          .freshness-strip {
            margin-top: 5px !important;
            padding-top: 5px !important;
          }

        `;

        doc.head.appendChild(style);

      }

      catch (err) {

        console.error(
          "Unable to apply Home Assistant styling:",
          err
        );

      }

    });

  </script>

</body>
</html>
